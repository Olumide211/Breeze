<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lagos 2090 by BreezeOg</title>
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 300; src: url('./fonts/Montserrat-Light.ttf') format('truetype'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
  canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  .title { position: absolute; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 300; opacity: 0;
           text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; will-change: opacity; }
  #credit { left: 120px; bottom: 112px; text-shadow: 0 1px 14px rgba(20,10,30,.55), 0 0 2px rgba(20,10,30,.5); }
  #credit .role { font-size: 25px; letter-spacing: .52em; margin-bottom: 14px; }
  #credit .name { font-size: 62px; letter-spacing: .30em; line-height: 1; }
  #credit .rule { width: 84px; height: 1.5px; background: #fff; margin: 0 0 22px 2px; opacity: .9; }
  #card { left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          text-shadow: 0 2px 30px rgba(10,20,40,.5); }
  #card .big { font-size: 150px; letter-spacing: .20em; margin-right: -.20em; line-height: 1; }
  #card .rule { width: 150px; height: 1.5px; background: #fff; margin: 46px 0 40px; opacity: .85; }
  #card .by { font-size: 40px; letter-spacing: .46em; margin-right: -.46em; }
  #dbg { position: absolute; left: 8px; top: 8px; color: #fff; font: 12px monospace; z-index: 9; text-shadow: 0 0 3px #000; white-space: pre; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="credit" class="title"><div class="rule"></div><div class="role"></div><div class="name"></div></div>
  <div id="card" class="title"><div class="big">Lagos 2090</div><div class="rule"></div><div class="by">by BreezeOg</div></div>
  <div id="dbg"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
