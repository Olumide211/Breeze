const REF_MASK = (() => { const g = r2ctx.createLinearGradient(0, FY, 0, FY + 220); for (let i = 0; i <= 10; i++) { const t = i / 10; g.addColorStop(t, `rgba(0,0,0,${0.35 * Math.pow(1 - t, 2.2)})`); } return g; })();
function buildReflection(usedBack, mirror3D) {
  const hw = cR.width, hh = cR.height;
  rctx.setTransform(1, 0, 0, 1, 0, 0); rctx.clearRect(0, 0, hw, hh);
  rctx.setTransform(K / 2, 0, 0, -K / 2, 0, K / 2 * 2 * FY);
  if (usedBack) rctx.drawImage(cLb, 0, 0, W, H);
  rctx.setTransform(K / 2, 0, 0, K / 2, 0, 0);
  if (mirror3D) mirror3D();
  rctx.setTransform(K / 2, 0, 0, -K / 2, 0, K / 2 * 2 * FY);
  rctx.drawImage(cLf, 0, 0, W, H);
  // blur (≈8px at stage scale) + fresnel fade mask
  r2ctx.setTransform(1, 0, 0, 1, 0, 0); r2ctx.globalCompositeOperation = 'source-over'; r2ctx.clearRect(0, 0, hw, hh);
  if (HAS_FILTER) { r2ctx.filter = `blur(${(8 * K / 2).toFixed(2)}px)`; r2ctx.drawImage(cR, 0, 0); r2ctx.filter = 'none'; }

}

/* ============================ camera & post ========================== */
function camera(f) {
  const w1 = f < 168 ? eO3(prog(f, 162, 168)) : 1 - eIO3(prog(f, 168, 178));
  const w2 = f < 246 ? eO3(prog(f, 240, 246)) : 1 - eIO3(prog(f, 246, 256));
  const s = 1 + 0.08 * eIOs(f / (NF - 1)) + 0.06 * w1 + 0.03 * w2;
  return { s, dx: 6 * Math.sin(TAU * f / (7 * FPS)), dy: 4 * Math.sin(TAU * f / (7 * FPS) + 1.3) };
}
const caAmt = f => 1.5 * Math.max(bump(f, 162, 165, 174), bump(f, 240, 244, 252));
function post(f) {
  const bw = out.width, bh = out.height, o = octx;
  o.setTransform(1, 0, 0, 1, 0, 0); o.globalCompositeOperation = 'source-over'; o.globalAlpha = 1;
  o.fillStyle = rgba(COL.bg); o.fillRect(0, 0, bw, bh);
  const c0 = camera(f), c1 = camera(f - 0.5), vel = Math.abs(c0.s - c1.s);
  const N = vel > 0.0015 ? 6 : 1;
  for (let j = 0; j < N; j++) {
    const c = N > 1 ? camera(f - 0.5 * j / (N - 1)) : c0;
    o.globalAlpha = 1 / (j + 1);
    o.setTransform(c.s, 0, 0, c.s, CX * K * (1 - c.s) + c.dx * K * c.s, CY * K * (1 - c.s) + c.dy * K * c.s);
    o.drawImage(cS, 0, 0);
  }
  o.setTransform(1, 0, 0, 1, 0, 0); o.globalAlpha = 1;
  const ca = caAmt(f) * K;
  if (ca > 0.05) {
    tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.globalCompositeOperation = 'copy'; tctx.drawImage(out, 0, 0); tctx.globalCompositeOperation = 'source-over';
    o.fillStyle = '#000'; o.fillRect(0, 0, bw, bh);
    const chans = [['#ff0000', 1], ['#00ff00', 0], ['#0000ff', -1]];
    for (const [col, sgn] of chans) {
      chctx.setTransform(1, 0, 0, 1, 0, 0); chctx.globalCompositeOperation = 'copy'; chctx.drawImage(cTmp, 0, 0);
      chctx.globalCompositeOperation = 'multiply'; chctx.fillStyle = col; chctx.fillRect(0, 0, bw, bh); chctx.globalCompositeOperation = 'source-over';
      const sc = 1 + sgn * ca / (bw / 2);
      o.globalCompositeOperation = 'lighter'; o.setTransform(sc, 0, 0, sc, bw / 2 * (1 - sc), bh / 2 * (1 - sc)); o.drawImage(cCh, 0, 0);
    }
    o.globalCompositeOperation = 'source-over'; o.setTransform(1, 0, 0, 1, 0, 0);
  }
  o.drawImage(cVig, 0, 0);
  const fi = Math.floor(f + 1e-6), rng = mulberry32(fi * 7919 + 13);
  const pat = GRAIN_PAT[fi % 4]; pat.setTransform(new DOMMatrix().translate(Math.floor(rng() * 256), Math.floor(rng() * 256)));
  o.fillStyle = pat; o.fillRect(0, 0, bw, bh);
}

/* ============================ frame render =========================== */
const YF_MIRROR = 2 * YFW;
function render3D(f, mirrorPass) {
  const sub = (f >= 240 && f < 254) ? [-0.5, -0.375, -0.25, -0.125, 0] : [0];
  if (mirrorPass) {
    updateSegs(frameParams(f));
    root.scale.y = -1; root.position.y = YF_MIRROR; renderer.render(scene, cam);
    rctx.drawImage(glc, 0, 0, W, H);
    root.scale.y = 1; root.position.y = 0;
    return;
  }
  g2ctx.setTransform(1, 0, 0, 1, 0, 0); g2ctx.globalAlpha = 1; g2ctx.clearRect(0, 0, cG2.width, cG2.height);
  sub.forEach((d, j) => {
    updateSegs(frameParams(f + d));
    renderer.render(scene, cam);
    g2ctx.globalAlpha = 1 / (j + 1); g2ctx.drawImage(glc, 0, 0);
  });
  g2ctx.globalAlpha = 1;
}
function render(f) {
  f = clamp(f, 0, NF - 1);
  for (const c of [lb, lf]) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, cLf.width, cLf.height); c.setTransform(K, 0, 0, K, 0, 0); }
  const has3D = f >= 162 && f < 262;
  const S = has3D ? frameParams(f) : null;
  sparkScene(lf, f);
  drawBox(lf, f);
  drawTyping(lf, f);
  const usedBack = has3D ? drawRingDecor(f, S) : false;
  drawWordParticles(lf, f);
  drawLockup(lf, f);
  buildReflection(usedBack, has3D ? () => render3D(f, true) : null);
  if (has3D) render3D(f, false);
  drawStage(f, has3D, usedBack);
  post(f);
}

/* ============================ playback & UI ========================== */
const ui = document.getElementById('ui'), btn = document.getElementById('play'), scrub = document.getElementById('scrub'), fc = document.getElementById('fc'), recBtn = document.getElementById('rec'), msg = document.getElementById('msg');
let frame = 0, playing = true, recording = false, last = performance.now(), dirty = true;
const q = new URLSearchParams(location.search);
if (q.has('t')) { frame = clamp(parseFloat(q.get('t')) * FPS || 0, 0, NF - 1); playing = q.has('play'); }
function setUI() { btn.textContent = playing ? 'Pause' : 'Play'; scrub.value = frame; fc.textContent = `f${String(Math.floor(frame + 1e-6)).padStart(3, '0')} · ${(frame / FPS).toFixed(2)}s`; }
function resize() { if (recording) return; const k = fitCss(); allocate(k); dirty = true; }
addEventListener('resize', resize);
resize();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!recording) {
    if (playing) { frame += dt * FPS; if (frame >= NF - 1) { frame = NF - 1; playing = false; } dirty = true; }
    if (dirty) { render(frame); setUI(); dirty = false; }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(t => { last = t; tick(t); });
const toggle = () => { if (!playing && frame >= NF - 1) frame = 0; playing = !playing; dirty = true; setUI(); };
btn.onclick = toggle;
scrub.oninput = () => { frame = parseFloat(scrub.value); playing = false; dirty = true; };
addEventListener('keydown', e => {
  if (recording) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight') { playing = false; frame = Math.min(NF - 1, Math.floor(frame + 1e-6) + 1); dirty = true; }
  else if (e.code === 'ArrowLeft') { playing = false; frame = Math.max(0, Math.ceil(frame - 1e-6) - 1); dirty = true; }
  else if (e.code === 'KeyR') { frame = 0; playing = true; dirty = true; }
  else if (e.code === 'KeyH') ui.classList.toggle('hidden');
});
let idleT; addEventListener('pointermove', () => { ui.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => playing && ui.classList.add('idle'), 2500); });
recBtn.onclick = async () => {
  if (recording || !window.MediaRecorder) return;
  recording = true; ui.classList.add('hidden'); msg.textContent = '';
  const keep = K; allocate(1);
  const stream = out.captureStream(FPS);
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 24_000_000 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  render(0); rec.start(); rec.pause();
  // render each frame while the recorder is paused, then expose it for exactly one frame interval,
  // so the file is 10.0 s at 30 fps no matter how long a frame takes to render
  for (let i = 0; i < NF; i++) {
    render(i);
    rec.resume();
    const t0 = performance.now();
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.drawImage(out, 0, 0, 1, 1, 0, 0, 1, 1); // mark dirty → capture this frame
    await new Promise(r => requestAnimationFrame(() => r()));
    const left = 1000 / FPS - 2 - (performance.now() - t0); if (left > 0) await new Promise(r => setTimeout(r, left));
    while (performance.now() - t0 < 1000 / FPS) { /* spin to the exact interval */ }
    rec.pause();
  }
  rec.resume();
  rec.stop(); await done;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'fable-5.5-reveal.webm'; a.click();
  recording = false; ui.classList.remove('hidden'); allocate(keep); frame = NF - 1; playing = false; dirty = true;
};
window.__fable = { render: f => { render(f); }, NF, LK, MATCH, DELTA, RANK, TYPE, FS };
setUI();
</script>
